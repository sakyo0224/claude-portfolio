<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="profileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="150" cy="150" r="150" fill="url(#profileGrad)"/>
  
  <!-- Person silhouette -->
  <g fill="white" opacity="0.9">
    <!-- Head -->
    <circle cx="150" cy="120" r="35"/>
    <!-- Body -->
    <ellipse cx="150" cy="220" rx="60" ry="80"/>
  </g>
  
  <!-- Initials -->
  <text x="150" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" opacity="0.8">
    SK
  </text>
</svg>